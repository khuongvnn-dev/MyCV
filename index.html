<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // Lấy ngôn ngữ từ trình duyệt
      const userLang = navigator.language || navigator.userLanguage;

      if (userLang.startsWith("vi")) {
        // Nội dung tiếng Việt
        document.write("<p>Nếu không tự động chuyển, hãy <a href='https://dub.sh/kieran_web'>bấm vào đây</a>.</p>");
      } else {
        // Nội dung tiếng Anh
        document.write("<p>If you are not redirected automatically, please <a href='https://dub.sh/kieran_web'>click here</a>.</p>");
      }

      // Redirect
      window.location.href = "https://dub.sh/kieran_web";
    </script>
  </head>
  <body>
  </body>
</html>
